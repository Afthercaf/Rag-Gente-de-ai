services:
  - type: web
    name: backend
    env: python
    plan: free

    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: uvicorn api2a:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"