services:
  redis:
    image: redis:7-alpine
    container_name: redis_session
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD debe estar definida en .env}"
    # VULN-19: Redis no se expone al host; solo la red interna de Docker.
    expose:
      - "6379"
    networks:
      - backend
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_backend
    restart: unless-stopped
    depends_on:
      tailscale:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
    command: ["uvicorn", "api2:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: pizzeria-backend
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:?TS_AUTHKEY debe estar definida en .env}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"

networks:
  backend:
    driver: bridge

volumes:
  tailscale-state:
  redis-data:
